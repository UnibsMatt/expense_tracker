server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;


    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

    # Docker DNS, resolved per request so nginx starts even if the backend is down
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:9000;

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 1m;
    }

    # Hashed build assets can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }
}
